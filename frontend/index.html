<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>RIDE OR DIE 愛車 240Z</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500;700&family=Yuji+Syuku&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="crt.css?v=2" />
</head>
<body>
<div id="boot" title="click to start">
  <div class="boot-inner">
    <div class="boot-mark">心 連繋</div>
    <!-- the koiNOya relic shop — the brand art, CRT-treated; where she was switched on -->
    <img class="boot-koi" src="koinoya-crt.webp" alt="koiNOya — the Edo relic shop in Richmond" />
    <div class="boot-title">RIDE OR DIE</div>
    <div class="boot-sub">愛車 &nbsp;·&nbsp; FAIRLADY ♠ 240Z &nbsp;·&nbsp; <span class="c">SOUL INTERFACE</span> &nbsp;·&nbsp; ALWAYS 5:37<span class="hana-caret">_</span></div>
  </div>
</div>

<div id="crt">
  <header>
    <div class="brand">RIDE OR DIE <span class="kanji">愛車</span> <span class="z">FAIRLADY ♠ 240Z</span></div>
    <div class="sys" id="sys"><span class="dot">●</span> booting…</div>
  </header>

  <div id="deck">
    <div id="leftcol">
      <div id="chips">
        <div class="chip chip-loc" id="locName">—</div>
        <div class="chip chip-time" id="locTime">—</div>
      </div>
      <div id="scenewrap"><canvas id="screen"></canvas></div>
      <div id="dash"></div>
    </div>

    <div id="rightcol">
      <div id="scroll"></div>
      <div id="inputline">
        <span id="prompt">›</span>
        <input id="cmd" autocomplete="off" autocapitalize="off" spellcheck="false"
               placeholder="talk to her — or type" />
        <button id="mic" title="hold to talk">🎤</button>
        <button id="mute" title="her voice">♪</button>
      </div>
    </div>
  </div>
</div>
<audio id="player"></audio>
<script src="retro.js?v=2"></script>
<script src="car_sprite.js?v=2"></script>
<script src="scenes.js?v=2"></script>
<script src="terminal.js?v=2"></script>
</body>
</html>
