<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>RIDE OR DIE 愛車 240Z</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500;700&family=Yuji+Syuku&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="crt.css" />
</head>
<body>
<div id="boot" title="click to start">
  <div class="boot-inner">
    <div class="boot-mark">心 連繋</div>
    <svg class="boot-koi" viewBox="0 0 220 92" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M28,46 C52,20 118,16 156,32 C172,39 180,49 190,45 C178,60 150,69 118,67 C76,64 42,60 28,46 Z" fill="#38d6ec"/>
      <path d="M186,40 L218,22 L206,46 L218,70 L186,52 Z" fill="#38d6ec"/>
      <path d="M104,62 L122,84 L88,74 Z" fill="#2ba8bf"/>
      <path d="M118,22 L138,8 L132,28 Z" fill="#2ba8bf"/>
      <circle cx="48" cy="40" r="4.5" fill="#0e0c0a"/>
      <path d="M6,80 C46,72 96,76 140,72 C172,69 196,72 214,68" stroke="#1f6f7d" stroke-width="3" stroke-linecap="round"/>
      <path d="M16,88 C56,82 100,85 150,82" stroke="#13262a" stroke-width="3" stroke-linecap="round"/>
    </svg>
    <div class="boot-title">RIDE OR DIE</div>
    <div class="boot-sub">愛車 &nbsp;·&nbsp; FAIRLADY ♠ 240Z &nbsp;·&nbsp; <span class="c">SOUL INTERFACE</span> &nbsp;·&nbsp; ALWAYS 5:37<span class="hana-caret">_</span></div>
  </div>
</div>

<div id="crt">
  <header>
    <div class="brand">RIDE OR DIE <span class="kanji">愛車</span> <span class="z">FAIRLADY ♠ 240Z</span></div>
    <div class="sys" id="sys"><span class="dot">●</span> booting…</div>
  </header>

  <div id="deck">
    <div id="leftcol">
      <div id="chips">
        <div class="chip chip-loc" id="locName">—</div>
        <div class="chip chip-time" id="locTime">—</div>
      </div>
      <div id="scenewrap"><canvas id="screen"></canvas></div>
      <div id="dash"></div>
    </div>

    <div id="rightcol">
      <div id="scroll"></div>
      <div id="inputline">
        <span id="prompt">›</span>
        <input id="cmd" autocomplete="off" autocapitalize="off" spellcheck="false"
               placeholder="talk to her — or type" />
        <button id="mic" title="hold to talk">🎤</button>
        <button id="mute" title="her voice">♪</button>
      </div>
    </div>
  </div>
</div>
<audio id="player"></audio>
<script src="retro.js"></script>
<script src="car_sprite.js"></script>
<script src="scenes.js"></script>
<script src="terminal.js"></script>
</body>
</html>
